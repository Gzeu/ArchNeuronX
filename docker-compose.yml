version: '3.8'

services:
  # ============================================================
  # Main ArchNeuronX Trading Service (Production Ready)
  # ============================================================
  archneuronx:
    build:
      context: .
      dockerfile: Dockerfile.native
    image: archneuronx:latest
    container_name: archneuronx_trading
    restart: unless-stopped
    ports:
      - "8080:8080"   # REST API
      - "9090:9090"   # Metrics (future)
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models
      - archneuronx_data:/app/data
      - archneuronx_logs:/app/logs
    environment:
      - ARCHNEURONX_LOG_LEVEL=info
      - ARCHNEURONX_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - archneuronx_net

  # ============================================================
  # Grafana Dashboard
  # ============================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: archneuronx_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=archneuronx_admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - archneuronx_net

volumes:
  archneuronx_data:
  archneuronx_logs:
  grafana_data:

networks:
  archneuronx_net:
    driver: bridge
