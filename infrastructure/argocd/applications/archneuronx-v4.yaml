# ============================================================
# ArchNeuronX v4.0 - ArgoCD Application
# GitOps deployment for continuous delivery
# ============================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: archneuronx-v4
  namespace: argocd
  labels:
    app: archneuronx-v4
    environment: production
    version: v4.0
  annotations:
    argocd.argoproj.io/sync-options: CreateNamespace=true
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  
  source:
    repoURL: https://github.com/Gzeu/ArchNeuronX.git
    targetRevision: main
    path: infrastructure/helm/archneuronx-v4
    helm:
      valueFiles:
      - values.yaml
      - values-production.yaml
      parameters:
      - name: global.imageRegistry
        value: "docker.io/archneuronx"
      - name: global.environment
        value: "production"
      - name: services.marketTransformer.replicaCount
        value: "20"
      - name: services.graphNetwork.replicaCount
        value: "10"
      - name: services.orderRouting.replicaCount
        value: "16"
      - name: services.riskManagement.replicaCount
        value: "12"
      - name: services.portfolioOptimizer.replicaCount
        value: "8"
      - name: services.regimeMetaLearner.replicaCount
        value: "6"
      - name: autoscaling.enabled
        value: "true"
      - name: monitoring.enabled
        value: "true"
      - name: istio.enabled
        value: "true"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: archneuronx-v4
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/name: archneuronx-v4
        app.kubernetes.io/part-of: archneuronx
        environment: production
        version: v4.0
      annotations:
        argocd.argoproj.io/managed-by: argocd
  
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
  - group: autoscaling
    kind: HorizontalPodAutoscaler
    jsonPointers:
    - /spec/minReplicas
    - /spec/maxReplicas
  
  revisionHistoryLimit: 10

---
# ============================================================
# Infrastructure Dependencies Application
# ============================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: archneuronx-v4-infrastructure
  namespace: argocd
  labels:
    app: archneuronx-v4-infrastructure
    environment: production
    version: v4.0
  annotations:
    argocd.argoproj.io/sync-options: CreateNamespace=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  
  source:
    repoURL: https://github.com/Gzeu/ArchNeuronX.git
    targetRevision: main
    path: infrastructure/terraform
    kustomize:
      images:
      - name: terraform
        newTag: "1.5.0"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: archneuronx-v4-infrastructure
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - RespectIgnoreDifferences=true

