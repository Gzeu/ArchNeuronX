# ============================================================
# ArchNeuronX v4.0 - Prometheus Monitoring Stack
# Ultra-Low Latency Trading System Monitoring
# ============================================================

# Global Configuration
global:
  rbac:
    create: true
    pspEnabled: false
  
  imageRegistry: ghcr.io/prometheus-operator
  
  imagePullSecrets: []

# Common Labels
commonLabels:
  project: archneuronx
  version: v4.0
  environment: production

# ============================================================
# Prometheus Server Configuration
# ============================================================
prometheus:
  enabled: true
  
  # High-performance configuration for trading systems
  image:
    repository: prom/prometheus
    tag: v2.51.0
    pullPolicy: IfNotPresent
  
  # Resource limits for high-performance monitoring
  resources:
    requests:
      cpu: 2000m
      memory: 8Gi
    limits:
      cpu: 4000m
      memory: 16Gi
  
  # Data retention for trading analysis
  retention: 30d
  retentionSize: 50GB
  
  # Storage configuration
  prometheusSpec:
    # Storage for high-frequency data
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nvme-ssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Gi
    
    # Replication for high availability
    replicas: 2
    
    # High-performance scraping configuration
    scrapeInterval: 5s
    evaluationInterval: 5s
    
    # External labels for multi-region deployment
    externalLabels:
      region: us-east-1
      environment: production
      version: v4.0
    
    # Remote write for long-term storage
    remoteWrite:
    - url: "https://prometheus-remote-write.example.com/api/v1/write"
      queueConfig:
        maxSamplesPerSend: 10000
        maxShards: 200
        capacity: 2500
    
    # Alerting configuration
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager:9093
    
    # Additional scrape configs for trading metrics
    additionalScrapeConfigs:
    - job_name: 'archneuronx-v4-gpu'
      static_configs:
        - targets: ['archneuronx-v4-gpu-service:9090']
      scrape_interval: 2s
      scrape_timeout: 1s
      metrics_path: /metrics
      relabel_configs:
        - source_labels: [__address__]
          target_label: instance
          replacement: 'gpu-inference'
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: node
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
    
    - job_name: 'archneuronx-v4-cpu'
      static_configs:
        - targets: ['archneuronx-v4-cpu-service:9090']
      scrape_interval: 2s
      scrape_timeout: 1s
      metrics_path: /metrics
      relabel_configs:
        - source_labels: [__address__]
          target_label: instance
          replacement: 'cpu-execution'
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: node
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
    
    - job_name: 'kubernetes-nodes-gpu'
      kubernetes_sd_configs:
        - role: node
      relabel_configs:
        - source_labels: [__meta_kubernetes_node_label_node_type]
          regex: gpu
          action: keep
        - source_labels: [__meta_kubernetes_node_label_node_type]
          target_label: node_type
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
    
    - job_name: 'kubernetes-nodes-cpu'
      kubernetes_sd_configs:
        - role: node
      relabel_configs:
        - source_labels: [__meta_kubernetes_node_label_node_type]
          regex: cpu
          action: keep
        - source_labels: [__meta_kubernetes_node_label_node_type]
          target_label: node_type
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

# ============================================================
# Grafana Configuration
# ============================================================
grafana:
  enabled: true
  
  image:
    repository: grafana/grafana
    tag: 10.4.0
    pullPolicy: IfNotPresent
  
  # Admin configuration
  adminUser: admin
  adminPassword: archneuronx_admin_v4
  
  # Resources for dashboard rendering
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 1000m
      memory: 4Gi
  
  # Persistence for dashboards and data
  persistence:
    enabled: true
    type: pvc
    storageClassName: nvme-ssd
    size: 20Gi
  
  # Grafana configuration
  grafanaIni:
    server:
      domain: grafana.archneuronx.com
      root_url: "https://grafana.archneuronx.com"
      serve_from_sub_path: true
    
    database:
      type: postgres
      host: archneuronx-postgres
      name: grafana
      user: grafana
      password: ${POSTGRES_PASSWORD}
    
    auth:
      disable_login_form: false
      oauth_auto_login: false
    
    security:
      allow_embedding: true
      strict_transport_security: true
      content_security_policy: true
    
    analytics:
      check_for_updates: false
      reporting_enabled: false
  
  # Dashboards
  dashboards:
    default:
      # ArchNeuronX v4.0 specific dashboards
      archneuronx-overview:
        gnetId: null
        path: dashboards/archneuronx-v4-overview.json
        datasource: Prometheus
      
      archneuronx-performance:
        gnetId: null
        path: dashboards/archneuronx-v4-performance.json
        datasource: Prometheus
      
      archneuronx-latency:
        gnetId: null
        path: dashboards/archneuronx-v4-latency.json
        datasource: Prometheus
      
      archneuronx-throughput:
        gnetId: null
        path: dashboards/archneuronx-v4-throughput.json
        datasource: Prometheus
      
      archneuronx-gpu-metrics:
        gnetId: null
        path: dashboards/archneuronx-v4-gpu.json
        datasource: Prometheus
      
      archneuronx-trading-metrics:
        gnetId: null
        path: dashboards/archneuronx-v4-trading.json
        datasource: Prometheus
      
      # System monitoring dashboards
      kubernetes-overview:
        gnetId: null
        path: dashboards/kubernetes-overview.json
        datasource: Prometheus
      
      node-exporter:
        gnetId: null
        path: dashboards/node-exporter.json
        datasource: Prometheus
  
  # Data sources
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server:9090
        access: proxy
        isDefault: true
        editable: true
        jsonData:
          timeInterval: "5s"
          queryTimeout: "60s"
          httpMethod: POST
      
      - name: Loki
        type: loki
        url: http://loki:3100
        access: proxy
        editable: true
        jsonData:
          maxLines: 1000
      
      - name: Jaeger
        type: jaeger
        url: http://jaeger:16686
        access: proxy
        editable: true

# ============================================================
# AlertManager Configuration
# ============================================================
alertmanager:
  enabled: true
  
  image:
    repository: prom/alertmanager
    tag: v0.26.0
    pullPolicy: IfNotPresent
  
  # Resources for alert processing
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  
  # Persistence for alert data
  persistence:
    enabled: true
    type: pvc
    storageClassName: nvme-ssd
    size: 5Gi
  
  # AlertManager configuration
  alertmanagerSpec:
    replicas: 2
    
    # Storage configuration
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: nvme-ssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    
    # External URL configuration
    externalUrl: "https://alertmanager.archneuronx.com"
    
    # Route configuration
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'web.hook'
      routes:
      - match:
          severity: critical
        receiver: 'critical-alerts'
        group_wait: 5s
        repeat_interval: 5m
      - match:
          severity: warning
        receiver: 'warning-alerts'
        group_wait: 10s
        repeat_interval: 15m
      - match:
          severity: info
        receiver: 'info-alerts'
        group_wait: 30s
        repeat_interval: 1h
    
    # Receivers configuration
    receivers:
    - name: 'web.hook'
      webhook_configs:
      - url: 'http://archneuronx-alerts:8080/webhook'
        send_resolved: true
        http_config:
          bearer_token: '${ALERT_WEBHOOK_TOKEN}'
    
    - name: 'critical-alerts'
      slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#critical-alerts'
        title: '🚨 Critical Alert: {{ .GroupLabels.alertname }}'
        text: |
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* Critical
          *Cluster:* {{ .GroupLabels.cluster }}
          *Service:* {{ .GroupLabels.service }}
          *Description:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
          *Runbook:* {{ range .Alerts }}{{ .Annotations.runbook_url }}{{ end }}
        send_resolved: true
        color: 'danger'
        icon_emoji: ':rotating_light:'
      
      pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY}'
        description: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          resolved: '{{ .Alerts.Resolved | len }}'
          cluster: '{{ .GroupLabels.cluster }}'
          service: '{{ .GroupLabels.service }}'
    
    - name: 'warning-alerts'
      slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#warnings'
        title: '⚠️ Warning: {{ .GroupLabels.alertname }}'
        text: |
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* Warning
          *Cluster:* {{ .GroupLabels.cluster }}
          *Service:* {{ .GroupLabels.service }}
          *Description:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
        send_resolved: true
        color: 'warning'
        icon_emoji: ':warning:'
    
    - name: 'info-alerts'
      slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#info'
        title: 'ℹ️ Info: {{ .GroupLabels.alertname }}'
        text: |
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* Info
          *Cluster:* {{ .GroupLabels.cluster }}
          *Service:* {{ .GroupLabels.service }}
          *Description:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
        send_resolved: true
        color: 'good'
        icon_emoji: ':information_source:'

# ============================================================
# Node Exporter Configuration
# ============================================================
nodeExporter:
  enabled: true
  
  image:
    repository: prom/node-exporter
    tag: v1.7.0
    pullPolicy: IfNotPresent
  
  # Deploy on all nodes including GPU nodes
  hostRootFs: false
  hostMountPropagation: None
  
  # Resources for system monitoring
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  
  # Additional collectors for trading systems
  serviceMonitor:
    enabled: true
    jobLabel: jobLabel
    interval: 10s
    scrapeTimeout: 5s
  
  # Additional collectors
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)
    - --collector.netdev.device-exclude=^(veth.*|docker.*|cbr.*)$
    - --collector.statfs
    - --collector.time
    - --collector.cpufreq
    - --collector.meminfo_numa
    - --collector.netclass
    - --collector.netdev
    - --collector.netstat
    - --collector.pressure
    - --collector.processes
    - --collector.sockstat
    - --collector.softirqs
    - --collector.stat
    - --collector.textfile
    - --collector.thermal_zone
    - --collector.time
    - --collector.timex
    - --collector.udp_queues
    - --collector.uname
    - --collector.vmstat
    - --collector.xfs
    - --collector.zfs

# ============================================================
# Kube State Metrics
# ============================================================
kubeStateMetrics:
  enabled: true
  
  image:
    repository: k8s.gcr.io/kube-state-metrics/kube-state-metrics
    tag: v2.10.1
    pullPolicy: IfNotPresent
  
  # Resources for Kubernetes state monitoring
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # Service monitor configuration
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s

# ============================================================
# Blackbox Exporter
# ============================================================
blackboxExporter:
  enabled: true
  
  image:
    repository: prom/blackbox-exporter
    tag: v0.24.0
    pullPolicy: IfNotPresent
  
  # Resources for external monitoring
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  
  # Blackbox modules configuration
  config:
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions:
          - "HTTP/1.1"
          - "HTTP/2.0"
          method: GET
          follow_redirects: true
          fail_if_ssl: false
          fail_if_not_ssl: false
          tls_config:
            insecure_skip_verify: false
          preferred_ip_protocol: "ip4"
      
      tcp_connect:
        prober: tcp
        timeout: 5s
        tcp:
          preferred_ip_protocol: "ip4"
      
      icmp:
        prober: icmp
        timeout: 5s
        icmp:
          preferred_ip_protocol: "ip4"
  
  # Service monitor for endpoint monitoring
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    module: http_2xx
    targets:
    - archneuronx-v4-gpu-service:8080
    - archneuronx-v4-cpu-service:8080

# ============================================================
# Additional Components
# ============================================================

# Pushgateway for batch metrics
pushgateway:
  enabled: true
  image:
    repository: prom/pushgateway
    tag: v1.6.2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Prometheus Operator
prometheusOperator:
  enabled: true
  
  image:
    repository: quay.io/prometheus-operator/prometheus-operator
    tag: v0.68.0
    pullPolicy: IfNotPresent
  
  # Resources for operator
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # Admission webhook
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true
      image:
        repository: jettech/kube-webhook-certgen
        tag: v1.5.2
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

# Default rules
defaultRules:
  enabled: true
  
  # Rules for trading systems
  rules:
    etcd: true
    k8s: true
    kubeApiserver: true
    kubelet: true
    kubeProxy: true
    kubeScheduler: true
    kubeControllerManager: true
    node: true
    network: true
    prometheus: true
    prometheusOperator: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
  
  # Additional rules for ArchNeuronX
  additionalRuleLabels:
    project: archneuronx
    version: v4.0

# ============================================================
# Network Policies
# ============================================================
networkPolicy:
  enabled: true
  
  # Egress rules for external communication
  egress:
    enabled: true
    to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

# ============================================================
# Pod Security Policy
# ============================================================
podSecurityPolicy:
  enabled: false
