# ============================================================
# ArchNeuronX v4.0 - Kubernetes Deployment Manifests
# Production Environment with Ultra-Low Latency Optimization
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: archneuronx-production
  labels:
    name: archneuronx-production
    version: v4.0
    project: archneuronx
    environment: production
---
# ============================================================
# ConfigMap - Application Configuration
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: archneuronx-v4-config
  namespace: archneuronx-production
  labels:
    app: archneuronx-v4
    version: v4.0
data:
  production.json: |
    {
      "version": "4.0.0",
      "service": "archneuronx_v4",
      "environment": "production",
      
      "engine": {
        "type": "ultra_low_latency",
        "target_latency_us": 20,
        "target_throughput_ops_per_sec": 500000,
        
        "neural_network": {
          "architecture": "quantum_transformer",
          "input_dim": 256,
          "hidden_dim": 512,
          "num_heads": 16,
          "num_layers": 8,
          "output_dim": 3,
          
          "optimizations": {
            "mixed_precision": true,
            "cuda_graphs": true,
            "memory_pools": true,
            "async_execution": true,
            "quantum_attention": true,
            "superposition_encoding": true,
            "entanglement_layers": true
          },
          
          "performance": {
            "max_batch_size": 64,
            "inference_streams": 4,
            "tensor_memory_pool_gb": 2,
            "precompile_graphs": true
          }
        },
        
        "execution": {
          "num_inference_threads": 4,
          "max_concurrent_requests": 64,
          "enable_pipeline_parallelism": true,
          "enable_memory_mapping": true,
          "enable_zero_copy": true,
          "cpu_affinity_core": 0,
          "enable_realtime_priority": true,
          "batch_processing_size": 32,
          "request_queue_depth": 1024
        }
      },
      
      "api": {
        "type": "v4_rest_server",
        "port": 8080,
        "num_threads": 8,
        "enable_ssl": true,
        "enable_compression": true,
        "max_request_size_mb": 1,
        "timeout_ms": 5000
      },
      
      "monitoring": {
        "enable_metrics": true,
        "metrics_port": 9090,
        "health_check_interval_sec": 15,
        "performance_tracking": true
      }
    }
---
# ============================================================
# Secret - Sensitive Configuration
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: archneuronx-v4-secrets
  namespace: archneuronx-production
  labels:
    app: archneuronx-v4
    version: v4.0
type: Opaque
data:
  # Base64 encoded values (replace with actual encoded values)
  api-key: <BASE64_ENCODED_API_KEY>
  database-url: <BASE64_ENCODED_DB_URL>
  redis-password: <BASE64_ENCODED_REDIS_PASSWORD>
  tls-cert: <BASE64_ENCODED_TLS_CERT>
  tls-key: <BASE64_ENCODED_TLS_KEY>
---
# ============================================================
# GPU Node Deployment - Neural Network Inference
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archneuronx-v4-gpu
  namespace: archneuronx-production
  labels:
    app: archneuronx-v4
    component: gpu-inference
    version: v4.0
    workload: neural-inference
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: archneuronx-v4
      component: gpu-inference
  template:
    metadata:
      labels:
        app: archneuronx-v4
        component: gpu-inference
        version: v4.0
        workload: neural-inference
        performance: ultra-low-latency
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        sidecar.istio.io/inject: "true"
    spec:
      # GPU node selection
      nodeSelector:
        node-type: gpu
        workload: neural-inference
      
      # Tolerations for GPU nodes
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      
      # High-priority for trading workloads
      priorityClassName: "system-cluster-critical"
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      containers:
      - name: archneuronx-v4-gpu
        image: ghcr.io/archneuronx/archneuronx-v4:latest
        imagePullPolicy: Always
        
        # Resource limits and requests for GPU workloads
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: "32Gi"
            nvidia.com/gpu: "1"
            hugepages-2Mi: "2Gi"
        
        # Environment variables
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: CUDA_DEVICE_ORDER
          value: "PCI_BUS_ID"
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"
        - name: ARCHNEURONX_CONFIG_PATH
          value: "/app/config/production.json"
        - name: ARCHNEURONX_LOG_LEVEL
          value: "info"
        - name: ARCHNEURONX_MODE
          value: "production"
        - name: OMP_NUM_THREADS
          value: "4"
        - name: NUMA_POLICY
          value: "local"
        
        # Port configuration
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        # Volume mounts
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: secrets-volume
          mountPath: /app/secrets
          readOnly: true
        - name: models-volume
          mountPath: /app/models
        - name: gpu-memory
          mountPath: /dev/shm
        - name: logs-volume
          mountPath: /app/logs
        - name: cache-volume
          mountPath: /app/cache
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /api/v4/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/v4/status
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Startup probe for slow-starting applications
        startupProbe:
          httpGet:
            path: /api/v4/health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      
      # Volumes
      volumes:
      - name: config-volume
        configMap:
          name: archneuronx-v4-config
      
      - name: secrets-volume
        secret:
          secretName: archneuronx-v4-secrets
      
      - name: models-volume
        persistentVolumeClaim:
          claimName: archneuronx-models-pvc
      
      - name: gpu-memory
        emptyDir:
          medium: "Memory"
          sizeLimit: "4Gi"
      
      - name: logs-volume
        persistentVolumeClaim:
          claimName: archneuronx-logs-pvc
      
      - name: cache-volume
        emptyDir:
          medium: "Memory"
          sizeLimit: "2Gi"
      
      # Affinity and anti-affinity rules
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - archneuronx-v4
              topologyKey: kubernetes.io/hostname
        
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - gpu
              - key: performance
                operator: In
                values:
                - ultra-low-latency
---
# ============================================================
# CPU Node Deployment - Trading Execution
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archneuronx-v4-cpu
  namespace: archneuronx-production
  labels:
    app: archneuronx-v4
    component: cpu-execution
    version: v4.0
    workload: trading-execution
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: archneuronx-v4
      component: cpu-execution
  template:
    metadata:
      labels:
        app: archneuronx-v4
        component: cpu-execution
        version: v4.0
        workload: trading-execution
        performance: real-time
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        sidecar.istio.io/inject: "true"
    spec:
      # CPU node selection
      nodeSelector:
        node-type: cpu
        workload: trading-execution
      
      # High-priority for trading workloads
      priorityClassName: "system-cluster-critical"
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      containers:
      - name: archneuronx-v4-cpu
        image: ghcr.io/archneuronx/archneuronx-v4:latest
        imagePullPolicy: Always
        
        # Resource limits and requests for CPU workloads
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            hugepages-2Mi: "1Gi"
          limits:
            cpu: "4"
            memory: "16Gi"
            hugepages-2Mi: "2Gi"
        
        # Environment variables
        env:
        - name: ARCHNEURONX_CONFIG_PATH
          value: "/app/config/production.json"
        - name: ARCHNEURONX_LOG_LEVEL
          value: "info"
        - name: ARCHNEURONX_MODE
          value: "production"
        - name: ARCHNEURONX_COMPONENT
          value: "trading-execution"
        - name: OMP_NUM_THREADS
          value: "4"
        - name: NUMA_POLICY
          value: "local"
        - name: CPU_AFFINITY
          value: "true"
        
        # Port configuration
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        # Volume mounts
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: secrets-volume
          mountPath: /app/secrets
          readOnly: true
        - name: cache-volume
          mountPath: /app/cache
        - name: logs-volume
          mountPath: /app/logs
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /api/v4/health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/v4/status
            port: http
          initialDelaySeconds: 5
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 3
      
      # Volumes
      volumes:
      - name: config-volume
        configMap:
          name: archneuronx-v4-config
      
      - name: secrets-volume
        secret:
          secretName: archneuronx-v4-secrets
      
      - name: cache-volume
        emptyDir:
          medium: "Memory"
          sizeLimit: "1Gi"
      
      - name: logs-volume
        persistentVolumeClaim:
          claimName: archneuronx-logs-pvc
      
      # Affinity rules for CPU workloads
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - archneuronx-v4
              topologyKey: kubernetes.io/hostname
        
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - cpu
              - key: performance
                operator: In
                values:
                - real-time
---
# ============================================================
# Services
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: archneuronx-v4-gpu-service
  namespace: archneuronx-production
  labels:
    app: archneuronx-v4
    component: gpu-inference
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: archneuronx-v4
    component: gpu-inference
---
apiVersion: v1
kind: Service
metadata:
  name: archneuronx-v4-cpu-service
  namespace: archneuronx-production
  labels:
    app: archneuronx-v4
    component: cpu-execution
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: archneuronx-v4
    component: cpu-execution
---
# ============================================================
# Ingress - External Access
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: archneuronx-v4-ingress
  namespace: archneuronx-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
spec:
  tls:
  - hosts:
    - api.archneuronx.com
    secretName: archneuronx-v4-tls
  rules:
  - host: api.archneuronx.com
    http:
      paths:
      - path: /api/v4(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: archneuronx-v4-gpu-service
            port:
              number: 8080
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: archneuronx-v4-gpu-service
            port:
              number: 9090
---
# ============================================================
# Horizontal Pod Autoscaler
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: archneuronx-v4-gpu-hpa
  namespace: archneuronx-production
  labels:
    app: archneuronx-v4
    component: gpu-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: archneuronx-v4-gpu
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: requests_per_second
      target:
        type: AverageValue
        averageValue: "10000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: archneuronx-v4-cpu-hpa
  namespace: archneuronx-production
  labels:
    app: archneuronx-v4
    component: cpu-execution
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: archneuronx-v4-cpu
  minReplicas: 4
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
  - type: Pods
    pods:
      metric:
        name: trades_per_second
      target:
        type: AverageValue
        averageValue: "50000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 20
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
---
# ============================================================
# Persistent Volume Claims
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archneuronx-models-pvc
  namespace: archneuronx-production
  labels:
    app: archneuronx-v4
    component: storage
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: gpu-memory
  resources:
    requests:
      storage: 500Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archneuronx-logs-pvc
  namespace: archneuronx-production
  labels:
    app: archneuronx-v4
    component: storage
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: nvme-ssd
  resources:
    requests:
      storage: 100Gi
---
# ============================================================
# Pod Disruption Budget
# ============================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: archneuronx-v4-gpu-pdb
  namespace: archneuronx-production
  labels:
    app: archneuronx-v4
    component: gpu-inference
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: archneuronx-v4
      component: gpu-inference
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: archneuronx-v4-cpu-pdb
  namespace: archneuronx-production
  labels:
    app: archneuronx-v4
    component: cpu-execution
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: archneuronx-v4
      component: cpu-execution
---
# ============================================================
# Service Monitor for Prometheus
# ============================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: archneuronx-v4-gpu-servicemonitor
  namespace: archneuronx-production
  labels:
    app: archneuronx-v4
    component: gpu-inference
    release: prometheus
spec:
  selector:
    matchLabels:
      app: archneuronx-v4
      component: gpu-inference
  endpoints:
  - port: metrics
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: archneuronx-v4-cpu-servicemonitor
  namespace: archneuronx-production
  labels:
    app: archneuronx-v4
    component: cpu-execution
    release: prometheus
spec:
  selector:
    matchLabels:
      app: archneuronx-v4
      component: cpu-execution
  endpoints:
  - port: metrics
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
---
# ============================================================
# Network Policy
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: archneuronx-v4-network-policy
  namespace: archneuronx-production
  labels:
    app: archneuronx-v4
    version: v4.0
spec:
  podSelector:
    matchLabels:
      app: archneuronx-v4
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: archneuronx-v4
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - namespaceSelector:
        matchLabels:
          name: logging
    - podSelector:
        matchLabels:
          app: archneuronx-v4
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
