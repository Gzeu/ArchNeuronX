# Production Docker Compose with GPU support
version: '3.8'

services:
  archneuronx-prod:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    volumes:
      - ./models:/app/models
      - ./config:/etc/archneuronx/config
    environment:
      - ARCHNEURONX_LOG_LEVEL=info
      - ARCHNEURONX_CONFIG=/etc/archneuronx/config
      - NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            driver: nvidia
            device_ids: ['0']
            capabilities: [gpu]
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      - prometheus
      - grafana

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: archneuronx-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:10.4.0
    container_name: archneuronx-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD: archneuronx_admin
      - GF_USERS_ALLOW_SIGN_UP: false
      - GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource

volumes:
  prometheus_data:
    grafana_data:
