# ============================================================
# ArchNeuronX v4.0 - Load Testing and Performance Validation
# Comprehensive testing for <20μs latency and 500K+ orders/sec
# ============================================================

version: '3.8'

services:
  # ============================================================
  # Load Testing Infrastructure
  # ============================================================
  
  load-generator:
    image: locustio/locust:2.17
    container_name: archneuronx-load-generator
    ports:
      - "8089:8089"  # Locust web interface
      - "5557:5557"  # Locust master port
    volumes:
      - ./tests/performance:/tests/performance
      - ./scripts:/scripts
    environment:
      - LOCUST_MODE=master
      - LOCUST_WEB_HOST=0.0.0.0
      - TARGET_URL=http://archneuronx-api:8080
      - EXPECTED_LATENCY_US=20
      - EXPECTED_THROUGHPUT=500000
    command: >
      --master
      --host=0.0.0.0
      --port=5557
      --web-host=0.0.0.0
      --web-port=8089
      -f /tests/performance/locustfile.py
      --html=/reports/performance_report.html
      --csv=/reports/performance_stats.csv
    networks:
      - archneuronx-network
    depends_on:
      - archneuronx-api
      - monitoring-stack

  load-worker-1:
    image: locustio/locust:2.17
    container_name: archneuronx-load-worker-1
    environment:
      - LOCUST_MODE=worker
      - LOCUST_MASTER_HOST=load-generator
      - LOCUST_MASTER_PORT=5557
    command: >
      --worker
      --master-host=load-generator
      --master-port=5557
    networks:
      - archneuronx-network
    depends_on:
      - load-generator

  load-worker-2:
    image: locustio/locust:2.17
    container_name: archneuronx-load-worker-2
    environment:
      - LOCUST_MODE=worker
      - LOCUST_MASTER_HOST=load-generator
      - LOCUST_MASTER_PORT=5557
    command: >
      --worker
      --master-host=load-generator
      --master-port=5557
    networks:
      - archneuronx-network
    depends_on:
      - load-generator

  load-worker-3:
    image: locustio/locust:2.17
    container_name: archneuronx-load-worker-3
    environment:
      - LOCUST_MODE=worker
      - LOCUST_MASTER_HOST=load-generator
      - LOCUST_MASTER_PORT=5557
    command: >
      --worker
      --master-host=load-generator
      --master-port=5557
    networks:
      - archneuronx-network
    depends_on:
      - load-generator

  # ============================================================
  # Performance Monitoring
  # ============================================================
  
  performance-monitor:
    image: prom/prometheus:v2.40.0
    container_name: archneuronx-perf-monitor
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/performance.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=1h'
      - '--web.enable-lifecycle'
    networks:
      - archneuronx-network

  grafana-dashboard:
    image: grafana/grafana:10.0.0
    container_name: archneuronx-grafana
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/performance-dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    networks:
      - archneuronx-network

  # ============================================================
  # ArchNeuronX v4.0 Services (Simplified for Testing)
  # ============================================================
  
  archneuronx-api:
    image: archneuronx/market-transformer:v4.0.0
    container_name: archneuronx-api
    ports:
      - "8080:8080"
      - "9090:9090"  # Metrics
    volumes:
      - ./models:/models
      - ./config:/config
    environment:
      - MODEL_PATH=/models/market_transformer_v4.pt
      - BATCH_SIZE=32
      - MAX_LATENCY_US=20
      - GPU_MEMORY_FRACTION=0.8
      - NUM_WORKERS=8
      - ENABLE_FLASH_ATTENTION=true
      - CUDA_VISIBLE_DEVICES=0
      - OMP_NUM_THREADS=8
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          cpus: '4.0'
          memory: 8G
    networks:
      - archneuronx-network

  redis-cache:
    image: redis:7-alpine
    container_name: archneuronx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 8gb --maxmemory-policy allkeys-lru
    networks:
      - archneuronx-network

  kafka-broker:
    image: confluentinc/cp-kafka:latest
    container_name: archneuronx-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 10
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      - zookeeper
    networks:
      - archneuronx-network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: archneuronx-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - archneuronx-network

  # ============================================================
  # Performance Analysis Tools
  # ============================================================
  
  latency-analyzer:
    image: python:3.9-alpine
    container_name: archneuronx-latency-analyzer
    volumes:
      - ./scripts/latency_analysis:/scripts
      - ./reports:/reports
    command: >
      sh -c "
      pip install pandas numpy matplotlib seaborn requests &&
      python /scripts/latency_analysis.py
      "
    networks:
      - archneuronx-network
    depends_on:
      - load-generator

  throughput-analyzer:
    image: python:3.9-alpine
    container_name: archneuronx-throughput-analyzer
    volumes:
      - ./scripts/throughput_analysis:/scripts
      - ./reports:/reports
    command: >
      sh -c "
      pip install pandas numpy matplotlib seaborn requests &&
      python /scripts/throughput_analysis.py
      "
    networks:
      - archneuronx-network
    depends_on:
      - load-generator

  # ============================================================
  # Test Data Generator
  # ============================================================
  
  market-data-generator:
    image: python:3.9-alpine
    container_name: archneuronx-data-generator
    volumes:
      - ./scripts/data_generator:/scripts
      - ./data:/data
    command: >
      sh -c "
      pip install pandas numpy faker requests &&
      python /scripts/data_generator.py
      "
    networks:
      - archneuronx-network
    depends_on:
      - kafka-broker

# ============================================================
# Networks
# ============================================================

networks:
  archneuronx-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================
# Volumes
# ============================================================

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  redis-data:
    driver: local
  kafka-data:
    driver: local
  zookeeper-data:
    driver: local

