name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.0)'
        required: false
      prerelease:
        description: 'Pre-release'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # JOB 1: Version & Changelog
  # ============================================
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/v}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "🎭 Release version: $VERSION"
    
    - name: Generate changelog
      id: changelog
      run: |
        # Get previous tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        if [ -n "$PREV_TAG" ]; then
          echo "📝 Generating changelog from $PREV_TAG..."
          CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
        else
          echo "📝 Generating changelog from beginning..."
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
        fi
        
        # Save to file for multiline output
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: Update VERSION file
      run: |
        echo "${{ steps.version.outputs.version }}" > VERSION
        echo "PROJECT_VERSION = ${{ steps.version.outputs.version }}" >> VERSION
    
    - name: Update CMakeLists.txt version
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        MAJOR=$(echo $VERSION | cut -d. -f1)
        MINOR=$(echo $VERSION | cut -d. -f2)
        PATCH=$(echo $VERSION | cut -d. -f3 || echo 0)
        
        sed -i "s/project(ArchNeuronX VERSION .*)/project(ArchNeuronX VERSION ${MAJOR}.${MINOR}.${PATCH})/" CMakeLists.txt
        
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add VERSION CMakeLists.txt
        git commit -m "chore: bump version to $VERSION" || echo "No version changes"
        git push origin HEAD:main || echo "Push skipped"

  # ============================================
  # JOB 2: Build Linux Binaries
  # ============================================
  build-linux:
    runs-on: ubuntu-latest
    needs: prepare-release
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential wget unzip libcurl4-openssl-dev libssl-dev libjsoncpp-dev
    
    - name: Download LibTorch
      run: |
        wget -q https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-2.1.0%2Bcpu.zip
        unzip -q libtorch-cxx11-abi-shared-with-deps-2.1.0+cpu.zip
    
    - name: Build Release
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$PWD/../libtorch
        make -j$(nproc)
    
    - name: Package binaries
      run: |
        cd build
        mkdir -p release/archneuronx-linux-x64
        cp bin/archneuronx release/archneuronx-linux-x64/ 2>/dev/null || cp archneuronx release/archneuronx-linux-x64/ 2>/dev/null || true
        cp -r $PWD/../libtorch/lib/*.so* release/archneuronx-linux-x64/ 2>/dev/null || true
        tar -czf archneuronx-${{ needs.prepare-release.outputs.version }}-linux-x64.tar.gz -C release .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-binary
        path: build/archneuronx-${{ needs.prepare-release.outputs.version }}-linux-x64.tar.gz

  # ============================================
  # JOB 3: Build Windows Binaries
  # ============================================
  build-windows:
    runs-on: windows-latest
    needs: prepare-release
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Install dependencies
      run: |
        choco install cmake -y
        vcpkg install curl:x64-windows openssl:x64-windows jsoncpp:x64-windows
    
    - name: Download LibTorch
      shell: powershell
      run: |
        Invoke-WebRequest -Uri 'https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-2.1.0%2Bcpu.zip' -OutFile 'libtorch.zip'
        Expand-Archive -Path 'libtorch.zip' -DestinationPath '.'
    
    - name: Build Release
      shell: powershell
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/../libtorch" -A x64
        cmake --build . --config Release -j
    
    - name: Package binaries
      shell: powershell
      run: |
        cd build
        $version = "${{ needs.prepare-release.outputs.version }}"
        $releaseDir = "release\archneuronx-win-x64"
        New-Item -ItemType Directory -Force -Path $releaseDir
        
        Copy-Item "Release\archneuronx.exe" $releaseDir -ErrorAction SilentlyContinue
        Copy-Item "..\libtorch\lib\*.dll" $releaseDir -ErrorAction SilentlyContinue
        
        Compress-Archive -Path $releaseDir -DestinationPath "archneuronx-$version-win-x64.zip"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-binary
        path: build/archneuronx-${{ needs.prepare-release.outputs.version }}-win-x64.zip

  # ============================================
  # JOB 4: Docker Multi-Platform Build
  # ============================================
  docker-release:
    runs-on: ubuntu-latest
    needs: prepare-release
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}},value=${{ needs.prepare-release.outputs.version }}
          type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare-release.outputs.version }}
          type=raw,value=latest
    
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ needs.prepare-release.outputs.version }}

  # ============================================
  # JOB 5: Create GitHub Release
  # ============================================
  create-release:
    runs-on: ubuntu-latest
    needs: [prepare-release, build-linux, build-windows, docker-release]
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
    
    - name: Display structure of downloaded files
      run: ls -la artifacts/
    
    - name: Create release notes
      id: notes
      run: |
        VERSION="${{ needs.prepare-release.outputs.version }}"
        CHANGELOG="${{ needs.prepare-release.outputs.changelog }}"
        PRERELEASE="${{ github.event.inputs.prerelease || 'false' }}"
        
        cat > release_notes.md << EOF
        ## 🚀 ArchNeuronX v${VERSION}
        
        ### 📦 Binary Downloads
        
        | Platform | Download |
        |----------|----------|
        | Linux x64 | \`archneuronx-${VERSION}-linux-x64.tar.gz\` |
        | Windows x64 | \`archneuronx-${VERSION}-win-x64.zip\` |
        
        ### 🐳 Docker
        
        \`\`\`bash
        docker pull ghcr.io/gzeu/archneuronx:${VERSION}
        docker pull ghcr.io/gzeu/archneuronx:latest
        \`\`\`
        
        ### 📝 Changelog
        
        ${CHANGELOG}
        
        ### 🔧 Installation
        
        **Linux:**
        \`\`\`bash
        tar -xzf archneuronx-${VERSION}-linux-x64.tar.gz
        cd archneuronx-linux-x64
        ./archneuronx --help
        \`\`\`
        
        **Windows:**
        Extract \`archneuronx-${VERSION}-win-x64.zip\` and run \`archneuronx.exe\`
        
        ### 📚 Documentation
        
        - [API Reference](docs/api.md)
        - [Training Guide](docs/training.md)
        - [Deployment](docs/deployment.md)
        EOF
        
        echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ needs.prepare-release.outputs.version }}
        name: ArchNeuronX v${{ needs.prepare-release.outputs.version }}
        body_path: release_notes.md
        draft: false
        prerelease: ${{ steps.notes.outputs.prerelease == 'true' }}
        files: |
          artifacts/linux-binary/*.tar.gz
          artifacts/windows-binary/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Announce Release
      run: |
        echo "🎉 Release v${{ needs.prepare-release.outputs.version }} created successfully!"
        echo "📦 Binaries: Linux + Windows"
        echo "🐳 Docker: ghcr.io/gzeu/archneuronx:${{ needs.prepare-release.outputs.version }}"

  # ============================================
  # JOB 6: Post-Release Notification
  # ============================================
  notify:
    runs-on: ubuntu-latest
    needs: [create-release]
    if: success()
    
    steps:
    - name: Webhook notification
      if: ${{ secrets.RELEASE_WEBHOOK_URL != '' }}
      run: |
        curl -X POST "${{ secrets.RELEASE_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{
            "text": "🚀 ArchNeuronX v${{ needs.prepare-release.outputs.version }} released!",
            "version": "${{ needs.prepare-release.outputs.version }}",
            "url": "https://github.com/Gzeu/ArchNeuronX/releases/tag/v${{ needs.prepare-release.outputs.version }}"
          }'
    
    - name: Success summary
      run: |
        echo "## ✅ Release Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** v${{ needs.prepare-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Linux x64 binary" >> $GITHUB_STEP_SUMMARY
        echo "- Windows x64 binary" >> $GITHUB_STEP_SUMMARY
        echo "- Docker image (amd64/arm64)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Links" >> $GITHUB_STEP_SUMMARY
        echo "- [Release Page](https://github.com/Gzeu/ArchNeuronX/releases/tag/v${{ needs.prepare-release.outputs.version }})" >> $GITHUB_STEP_SUMMARY
        echo "- [Docker Image](https://github.com/Gzeu/ArchNeuronX/pkgs/container/archneuronx)" >> $GITHUB_STEP_SUMMARY