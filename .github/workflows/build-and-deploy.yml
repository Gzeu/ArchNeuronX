name: Build and Deploy ArchNeuronX
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/deps
          key: ${{ runner.os }}-deps-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-deps-${{ hashFiles('**/CMakeLists.txt') }}
            
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            wget \
            curl \
            unzip \
            pkg-config \
            libssl-dev \
            libcurl4-openssl-dev \
            libboost-all-dev \
            libgtest-dev \
            libgmock-dev \
            python3 \
            python3-pip
            
      - name: Cache LibTorch
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/libtorch
            ~/.cache/libtorch-cxx11-abi-shared-with-deps
          key: ${{ runner.os }}-libtorch-${{ hashFiles('**/CMakeLists.txt') }}-${{ hashFiles('**/*.cpp') }}-${{ hashFiles('**/*.hpp') }}
          restore-keys: |
            ${{ runner.os }}-libtorch-${{ hashFiles('**/CMakeLists.txt') }}-${{ hashFiles('**/*.cpp') }}-${{ hashFiles('**/*.hpp') }}
            
      - name: Download LibTorch
        run: |
          if [ ! -f "libtorch/libtorch/libtorch.so" ]; then
            wget -q https://download.pytorch.org/libtorch/whl/cpu/libtorch-cxx11-abi-shared-with-deps-2.6.0%2Bcpu.zip -O libtorch.zip
            unzip -q libtorch.zip -d libtorch
            rm libtorch.zip
          fi
            
      - name: Build ArchNeuronX
        run: |
          mkdir -p build
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DUSE_CUDA=OFF
          cmake --build build --target archneuronx --parallel $(nproc)
          
      - name: Run Tests
        run: |
          cd build && ctest --output-on-failure --parallel $(nproc)
          
      - name: Build Docker Image
        run: |
          docker build -t archneuronx:cpu-latest .
          
      - name: Deploy to staging
        if: github.ref == 'refs/heads/main'
          run: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker push archneuronx:cpu-latest
            docker logout

  build_gpu:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Build GPU Docker Image
        run: |
          docker build -t archneuronx:gpu-latest -f Dockerfile.gpu .
          
      - name: Deploy GPU to production
        if: github.ref == 'refs/heads/main'
          run: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker push archneuronx:gpu-latest
            docker logout

  deploy:
    needs: [test, build_gpu]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        run: |
          echo "🚀 Deploying ArchNeuronX to production..."
          echo "✅ Tests passed"
          echo "✅ Build completed"
          echo "✅ Docker images pushed"
          echo "✅ Ready for production deployment"
