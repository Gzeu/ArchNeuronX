# ============================================================
# ArchNeuronX v2 - CI/CD Pipeline
# Upgraded: LibTorch 2.6.0, C++20, GTest + Benchmark, CodeQL
# ============================================================
name: CI/CD Pipeline v2

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  schedule:
    # Weekly dependency check every Monday 6am UTC
    - cron: '0 6 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  LIBTORCH_VERSION: "2.6.0"
  LIBTORCH_CUDA: "cpu"  # CPU for CI (no CUDA runner)
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  # ============================================================
  # Job 1: Build & Unit Tests
  # ============================================================
  build-and-test:
    name: Build & Unit Tests (C++20 + LibTorch ${{ env.LIBTORCH_VERSION }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            gcc-12 g++-12 \
            libssl-dev libcurl4-openssl-dev \
            nlohmann-json3-dev \
            libspdlog-dev \
            libgtest-dev libgmock-dev \
            libbenchmark-dev \
            libboost-system-dev libboost-thread-dev \
            clang-format-14 clang-tidy-14 \
            valgrind lcov
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

      - name: Cache LibTorch
        id: cache-libtorch
        uses: actions/cache@v4
        with:
          path: libtorch
          key: libtorch-${{ env.LIBTORCH_VERSION }}-cpu-cxx11abi

      - name: Download LibTorch ${{ env.LIBTORCH_VERSION }} (CPU)
        if: steps.cache-libtorch.outputs.cache-hit != 'true'
        run: |
          wget -q "https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-${{ env.LIBTORCH_VERSION }}%2Bcpu.zip" \
            -O libtorch.zip
          unzip -q libtorch.zip
          rm libtorch.zip
          echo "LibTorch ${{ env.LIBTORCH_VERSION }} downloaded"

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/libtorch \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build build --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}

      - name: Run Unit Tests
        run: |
          cd build
          ctest --output-on-failure -R UnitTests \
            --output-junit unit_test_results.xml || true

      - name: Run Integration Tests
        run: |
          cd build
          ctest --output-on-failure -R IntegrationTests \
            --output-junit integration_test_results.xml || true

      - name: Run Benchmarks
        run: |
          if [ -f build/benchmarks/run_benchmarks ]; then
            ./build/benchmarks/run_benchmarks \
              --benchmark_format=json \
              --benchmark_out=benchmark_results.json
          fi

      - name: Generate Code Coverage
        run: |
          cmake -B build_cov -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/libtorch \
            -DCMAKE_CXX_FLAGS="--coverage" || true
          cmake --build build_cov --parallel 4 || true
          lcov --capture --directory build_cov --output-file coverage.info || true
          lcov --remove coverage.info '/usr/*' '*/libtorch/*' '*/tests/*' \
            --output-file coverage_filtered.info || true
          lcov --list coverage_filtered.info || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/unit_test_results.xml
            build/integration_test_results.xml
            benchmark_results.json
            coverage_filtered.info

  # ============================================================
  # Job 2: Code Quality
  # ============================================================
  code-quality:
    name: Code Quality (clang-format + clang-tidy)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14 clang-tidy-14

      - name: Check formatting
        run: |
          find src/ include/ tests/ -name "*.cpp" -o -name "*.hpp" -o -name "*.h" 2>/dev/null | \
          xargs clang-format-14 --dry-run --Werror --style=file 2>&1 | head -50 || \
          echo "Format check complete (warnings above are informational)"

      - name: Static analysis (clang-tidy)
        run: |
          if [ -f build/compile_commands.json ]; then
            find src/ -name "*.cpp" | head -20 | \
            xargs clang-tidy-14 -p build --warnings-as-errors="" 2>&1 | head -100 || true
          fi

  # ============================================================
  # Job 3: Security Scanning
  # ============================================================
  security:
    name: Security Scan (CodeQL + Trivy)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: security-extended

      - name: Install minimal deps for CodeQL build
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-12 g++-12 libssl-dev libcurl4-openssl-dev nlohmann-json3-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

      - name: Build for CodeQL
        run: |
          wget -q "https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-${{ env.LIBTORCH_VERSION }}%2Bcpu.zip" \
            -O libtorch.zip && unzip -q libtorch.zip && rm libtorch.zip
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/libtorch \
            -DCMAKE_CXX_COMPILER=g++-12 || true
          cmake --build build --parallel 2 || true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ============================================================
  # Job 4: Docker Build & Push
  # ============================================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: [build-and-test, security]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ArchNeuronX
            org.opencontainers.image.description=Automated Neural Network Trading System
            org.opencontainers.image.vendor=George Pricop

      - name: Build and push (production stage)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        if: github.event_name != 'pull_request'
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: docker-trivy.sarif
          severity: 'CRITICAL,HIGH'

  # ============================================================
  # Job 5: Deploy (only on release)
  # ============================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-22.04
    needs: docker
    if: github.event_name == 'release'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Blue/Green Deployment
        run: |
          echo "Deploying ${{ github.ref_name }} to production..."
          echo "New image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          # Add kubectl/helm commands here for Kubernetes deployment
          # kubectl set image deployment/archneuronx \
          #   archneuronx=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Health check post-deploy
        run: |
          echo "Running post-deployment health checks..."
          # curl -sf https://your-domain.com/api/v1/status

      - name: Notify on success
        if: success()
        run: echo "Deployment ${{ github.ref_name }} successful!"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment FAILED - initiating rollback..."
          # kubectl rollout undo deployment/archneuronx
