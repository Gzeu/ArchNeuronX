<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchNeuronX Trading Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: #10b981;
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1f2937;
        }

        .card-value {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card-subtitle {
            color: #6b7280;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .chart-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
        }

        .time-selector {
            display: flex;
            gap: 0.5rem;
        }

        .time-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 10px;
            background: #f3f4f6;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .time-btn.active {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .time-btn:hover {
            transform: translateY(-2px);
        }

        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .model-card {
            background: #f9fafb;
            border-radius: 15px;
            padding: 1rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .model-card:hover {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            transform: translateY(-3px);
        }

        .model-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .model-status {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .refresh-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .error-message {
            background: #ef4444;
            color: white;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
            }
            
            .grid {
                grid-template-columns: 1fr;
            }
            
            .chart-header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">AX</div>
            <h1>ArchNeuronX Trading Dashboard</h1>
        </div>
        <div class="status-badge" id="systemStatus">Loading...</div>
    </header>

    <main class="container">
        <div class="error-message" id="errorMessage"></div>

        <div class="grid">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">System Status</h3>
                    <span>🖥️</span>
                </div>
                <div class="card-value" id="statusValue">-</div>
                <div class="card-subtitle">System Health</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Version</h3>
                    <span>📦</span>
                </div>
                <div class="card-value" id="versionValue">-</div>
                <div class="card-subtitle">Build Type</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Uptime</h3>
                    <span>⏰</span>
                </div>
                <div class="card-value" id="uptimeValue">-</div>
                <div class="card-subtitle">Running Time</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Active Models</h3>
                    <span>🤖</span>
                </div>
                <div class="card-value" id="modelsValue">-</div>
                <div class="card-subtitle">Neural Networks</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-header">
                <h2 class="chart-title">Available Models</h2>
                <div class="time-selector">
                    <button class="time-btn active">All</button>
                    <button class="time-btn">Active</button>
                    <button class="time-btn">Training</button>
                </div>
            </div>
            <div class="models-grid" id="modelsGrid">
                <div class="loading">Loading models...</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-header">
                <h2 class="chart-title">Performance Overview</h2>
                <div class="time-selector">
                    <button class="time-btn active">1D</button>
                    <button class="time-btn">1W</button>
                    <button class="time-btn">1M</button>
                    <button class="time-btn">1Y</button>
                </div>
            </div>
            <canvas id="performanceChart" width="400" height="200"></canvas>
        </div>

        <div class="chart-container">
            <div class="chart-header">
                <h2 class="chart-title">Risk Metrics</h2>
                <div class="time-selector">
                    <button class="time-btn active">Current</button>
                    <button class="time-btn">24H</button>
                    <button class="time-btn">7D</button>
                </div>
            </div>
            <canvas id="riskChart" width="400" height="200"></canvas>
        </div>
    </main>

    <button class="refresh-btn" onclick="refreshData()">🔄</button>

    <script>
        const API_BASE = 'http://localhost:8080/api/v1';
        
        // Initialize charts
        let performanceChart, riskChart;

        async function fetchAPI(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error(`API Error (${endpoint}):`, error);
                showError(`Failed to fetch ${endpoint}: ${error.message}`);
                return null;
            }
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }

</body>
</html>
